<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="arch-title" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="13">
  <title id="arch-title">플랫폼 어댑터는 얇게, 해석은 공유 C++ 코어가 맡는다</title>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- A background of its own, so the ink reads on a dark page too. -->
  <rect width="760" height="480" rx="8" fill="#ffffff"/>

  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">플랫폼 어댑터는 얇게, 해석은 공유 C++ 코어가 맡는다</text>

  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M132 132V164" marker-end="url(#arch-arrow)"/>
    <path d="M132 212V244" marker-end="url(#arch-arrow)"/>
    <path d="M380 132V244" marker-end="url(#arch-arrow)"/>
    <path d="M628 132V244" marker-end="url(#arch-arrow)"/>
    <path d="M132 400V368" marker-end="url(#arch-arrow)" stroke-dasharray="4 4"/>
    <path d="M240 428H272" marker-end="url(#arch-arrow)"/>
    <path d="M488 428H520" marker-end="url(#arch-arrow)"/>
    <path d="M628 400V368" marker-end="url(#arch-arrow)"/>
  </g>

  <!-- The adapters -->
  <g>
    <rect x="24" y="60" width="216" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="132" y="84" text-anchor="middle" font-weight="600" fill="#1f2328">UIKit 어댑터 (Swift)</text>
    <text x="132" y="100" text-anchor="middle" font-size="11.5" fill="#59636e">TraitCollection → Config</text>
    <text x="132" y="116" text-anchor="middle" font-size="11.5" fill="#59636e">UIImage로 이미지 디코딩</text>
  </g>
  <g>
    <rect x="272" y="60" width="216" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="380" y="84" text-anchor="middle" font-weight="600" fill="#1f2328">GTK4 어댑터 (C++)</text>
    <text x="380" y="100" text-anchor="middle" font-size="11.5" fill="#59636e">scale·다크 모드 → Config</text>
    <text x="380" y="116" text-anchor="middle" font-size="11.5" fill="#59636e">GdkTexture로 이미지 디코딩</text>
  </g>
  <g>
    <rect x="520" y="60" width="216" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="628" y="84" text-anchor="middle" font-weight="600" fill="#1f2328">WinUI 3 어댑터 (C++/WinRT)</text>
    <text x="628" y="100" text-anchor="middle" font-size="11.5" fill="#59636e">RasterizationScale → Config</text>
    <text x="628" y="116" text-anchor="middle" font-size="11.5" fill="#59636e">WIC로 이미지 디코딩</text>
  </g>

  <!-- The C API, which only the Swift adapter goes through -->
  <g>
    <rect x="24" y="164" width="216" height="48" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="132" y="192" text-anchor="middle" fill="#1f2328">C API 래퍼 (hydroid_res.h)</text>
  </g>

  <!-- The shared core -->
  <g>
    <rect x="24" y="244" width="712" height="124" rx="8" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"/>
    <text x="40" y="266" font-weight="600" fill="#1f2328">hydroid-res · 공유 C++17 코어</text>
  </g>
  <g>
    <rect x="40" y="280" width="158" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="119" y="304" text-anchor="middle" font-weight="600" fill="#1f2328">파서</text>
    <text x="119" y="320" text-anchor="middle" font-size="11.5" fill="#59636e">폴더 이름·XML</text>
    <text x="119" y="336" text-anchor="middle" font-size="11.5" fill="#59636e">pugixml 기반</text>
  </g>
  <g>
    <rect x="214" y="280" width="158" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="293" y="304" text-anchor="middle" font-weight="600" fill="#1f2328">ResourceTable</text>
    <text x="293" y="320" text-anchor="middle" font-size="11.5" fill="#59636e">패키지·타입·항목</text>
    <text x="293" y="336" text-anchor="middle" font-size="11.5" fill="#59636e">문자열 풀</text>
  </g>
  <g>
    <rect x="388" y="280" width="158" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="467" y="304" text-anchor="middle" font-weight="600" fill="#1f2328">Config 매칭</text>
    <text x="467" y="320" text-anchor="middle" font-size="11.5" fill="#59636e">match·isBetterThan</text>
    <text x="467" y="336" text-anchor="middle" font-size="11.5" fill="#59636e">결과 캐시</text>
  </g>
  <g>
    <rect x="562" y="280" width="158" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="641" y="304" text-anchor="middle" font-weight="600" fill="#1f2328">Theme·Style</text>
    <text x="641" y="320" text-anchor="middle" font-size="11.5" fill="#59636e">?attr·스타일 해석</text>
    <text x="641" y="336" text-anchor="middle" font-size="11.5" fill="#59636e">TypedArray 생성</text>
  </g>

  <!-- What the core reads: res/ while developing, the .hrt table hydroid-rc makes of it when shipped -->
  <g>
    <rect x="24" y="400" width="216" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="132" y="424" text-anchor="middle" font-weight="600" fill="#1f2328">res/ 소스 폴더</text>
    <text x="132" y="440" text-anchor="middle" font-size="11.5" fill="#59636e">개발 중에는 직접 로드</text>
  </g>
  <g>
    <rect x="272" y="400" width="216" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="380" y="424" text-anchor="middle" font-weight="600" fill="#1f2328">hydroid-rc 빌드 도구</text>
    <text x="380" y="440" text-anchor="middle" font-size="11.5" fill="#59636e">res/ → 바이너리 변환</text>
  </g>
  <g>
    <rect x="520" y="400" width="216" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
    <text x="628" y="424" text-anchor="middle" font-weight="600" fill="#1f2328">바이너리 테이블 .hrt</text>
    <text x="628" y="440" text-anchor="middle" font-size="11.5" fill="#59636e">앱에 번들, mmap으로 로드</text>
  </g>

  <text x="142" y="388" font-size="11.5" fill="#59636e">개발</text>
  <text x="638" y="388" font-size="11.5" fill="#59636e">배포</text>
</svg>
