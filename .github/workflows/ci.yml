name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - name: Install a decimal-comma locale
        if: runner.os == 'Linux'
        run: sudo locale-gen de_DE.UTF-8
      - name: Configure
        run: cmake --preset debug -DHYDROID_RES_REQUIRE_LOCALE_TESTS=ON
      - name: Build
        run: cmake --build --preset debug --parallel
      - name: Test
        run: ctest --preset debug

  golden-app:
    name: golden app builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble app and instrumentation test
        working-directory: golden
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
